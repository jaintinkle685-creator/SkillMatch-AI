<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Academic Mortarboard Cap & Constellation Nodes -->
  <g filter="url(#shadow)">
    <!-- Constellation Connections -->
    <line x1="140" y1="360" x2="256" y2="400" stroke="#93c5fd" stroke-width="3" stroke-opacity="0.6"/>
    <line x1="372" y1="360" x2="256" y2="400" stroke="#93c5fd" stroke-width="3" stroke-opacity="0.6"/>
    <line x1="140" y1="360" x2="180" y2="280" stroke="#93c5fd" stroke-width="3" stroke-opacity="0.6"/>
    <line x1="372" y1="360" x2="332" y2="280" stroke="#93c5fd" stroke-width="3" stroke-opacity="0.6"/>
    <line x1="180" y1="280" x2="256" y2="210" stroke="#93c5fd" stroke-width="4" stroke-opacity="0.8"/>
    <line x1="332" y1="280" x2="256" y2="210" stroke="#93c5fd" stroke-width="4" stroke-opacity="0.8"/>

    <!-- Mortarboard Diamond Top -->
    <polygon points="256,120 420,195 256,270 92,195" fill="#ffffff"/>

    <!-- Mortarboard Skullcap Underneath -->
    <path d="M165,232 L165,305 C165,340 347,340 347,305 L347,232 L256,270 Z" fill="#e2e8f0"/>

    <!-- Tassel Cord and Fringe -->
    <path d="M256,195 Q380,210 400,280" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="400" cy="285" r="10" fill="url(#goldGrad)"/>
    <rect x="394" y="295" width="12" height="28" rx="4" fill="url(#goldGrad)"/>

    <!-- Algorithm Synergy Nodes -->
    <circle cx="140" cy="360" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="4"/>
    <circle cx="256" cy="400" r="20" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
    <circle cx="372" cy="360" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="4"/>
    <circle cx="180" cy="280" r="12" fill="#a855f7" stroke="#ffffff" stroke-width="3"/>
    <circle cx="332" cy="280" r="12" fill="#ec4899" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Central Emblem AI Sparkle -->
  <path d="M256,170 Q256,195 240,195 Q256,195 256,220 Q256,195 272,195 Q256,195 256,170 Z" fill="#2563eb"/>
</svg>
